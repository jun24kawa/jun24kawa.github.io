<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>ご意見箱 ── 西川 純 ── 本</title>
<style>
:root{
  --bg:#fbfbf9; --fg:#1b1b1b; --muted:#6b6b6b; --rule:#e2e0da;
  --link:#8a4b2f; --link-strong:#6e3a22; --card:#fff; --btn:#8a4b2f; --btn-fg:#fff;
  --shadow:0 1px 2px rgba(30,20,10,.04), 0 2px 10px rgba(30,20,10,.05);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#1a1a19; --fg:#e6e4df; --muted:#9a978f; --rule:#38352f;
    --link:#e0a982; --link-strong:#eec3a3; --card:#232220; --btn:#e0a982; --btn-fg:#1a1a19;
    --shadow:0 1px 2px rgba(0,0,0,.25), 0 2px 10px rgba(0,0,0,.2);
  }
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--fg);
  font-family:"Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif JP",serif;
  line-height:1.9; font-size:17px;
}
.wrap{max-width:42em; margin:0 auto; padding:3.2rem 1.3rem 6rem;}
.home{
  display:inline-flex; align-items:center; gap:.3rem; margin-bottom:1.8rem;
  color:var(--muted); text-decoration:none; font-size:.88rem;
  padding:.3rem .8rem .3rem .6rem; border:1px solid var(--rule); border-radius:999px;
  transition:color .15s, border-color .15s;
}
.home:hover{color:var(--link); border-color:var(--link);}
h1{font-size:1.6rem; margin:0 0 1.3rem; font-weight:700;}
.intro{background:var(--card); border:1px solid var(--rule); border-radius:12px; box-shadow:var(--shadow); padding:1.4rem 1.5rem; margin:0 0 1.8rem;}
.intro p{margin:0 0 .9rem; text-align:justify;}
.intro p:last-child{margin-bottom:0;}
a{color:var(--link); text-underline-offset:.15em;}
a:hover{color:var(--link-strong);}
textarea{
  width:100%; min-height:12rem; padding:1rem; margin:0 0 .4rem;
  border:1px solid var(--rule); border-radius:10px; background:var(--card); color:var(--fg);
  font:inherit; font-size:1rem; line-height:1.8; resize:vertical; box-shadow:var(--shadow);
}
textarea:focus{outline:2px solid var(--link); outline-offset:1px;}
button{
  display:block; width:100%; padding:1rem; margin-top:1.1rem; font:inherit; font-size:1.02rem; font-weight:700;
  background:var(--btn); color:var(--btn-fg); border:none; border-radius:10px; cursor:pointer;
  transition:opacity .15s, transform .1s;
}
button:hover:not(:disabled){opacity:.9;}
button:active:not(:disabled){transform:translateY(1px);}
button:disabled{opacity:.45; cursor:default;}
.msg{margin-top:1rem; font-size:.95rem;}
.msg.ok{color:#3a7d3a;}
.msg.err{color:#b23b3b;}
.count{color:var(--muted); font-size:.85rem; text-align:right;}
.hp{position:absolute; left:-9999px; top:-9999px;}
</style>
</head>
<body>
<div class="wrap">
<a class="home" href="../">← 本の一覧にもどる</a>
<h1>ご意見箱</h1>

<div class="intro">
  <p>本を読んだご感想、ご意見があればお書きください。その際、本のタイトルもお忘れなく。</p>
  <p>また、新たな本の執筆をご希望の場合は、本のタイトル案と、その本が必要な理由をお書きください。</p>
  <p>書き終わったら、下の送信ボタンを押してください。</p>
</div>

<form id="f">
  <label class="hp" aria-hidden="true">
    ここには何も入力しないでください
    <input type="text" name="website" tabindex="-1" autocomplete="off">
  </label>
  <textarea id="message" name="message" maxlength="4000" required placeholder="ここにお書きください"></textarea>
  <div class="count"><span id="count">0</span> / 4000</div>
  <button type="submit" id="submit">送信ボタンを押してください</button>
  <div class="msg" id="msg" role="status"></div>
</form>
</div>
<script>
(() => {
  "use strict";
  const API = "https://nishikawa-qa.pages.dev/api/feedback";
  const form = document.getElementById("f");
  const textarea = document.getElementById("message");
  const countEl = document.getElementById("count");
  const submitBtn = document.getElementById("submit");
  const msgEl = document.getElementById("msg");

  textarea.addEventListener("input", () => {
    countEl.textContent = textarea.value.length;
  });

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const message = textarea.value.trim();
    if (!message) return;
    submitBtn.disabled = true;
    msgEl.className = "msg";
    msgEl.textContent = "送信しています…";
    try {
      const res = await fetch(API, {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({
          message,
          website: form.website.value,
        }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        msgEl.className = "msg err";
        msgEl.textContent = data.error || "送信に失敗しました。時間をおいてもう一度お試しください。";
        submitBtn.disabled = false;
        return;
      }
      msgEl.className = "msg ok";
      msgEl.textContent = "送信しました。ありがとうございました。";
      form.reset();
      countEl.textContent = "0";
      submitBtn.disabled = true;
    } catch (err) {
      msgEl.className = "msg err";
      msgEl.textContent = "通信に失敗しました。時間をおいてもう一度お試しください。";
      submitBtn.disabled = false;
    }
  });
})();
</script>
</body>
</html>
