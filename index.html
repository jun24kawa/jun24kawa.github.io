<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>西川 純 ── 本</title>
<style>
:root{
  --bg:#fbfbf9; --fg:#1b1b1b; --muted:#6b6b6b; --rule:#e2e0da;
  --link:#8a4b2f; --draft-bg:#fff4e5; --draft-fg:#8a5a1a; --draft-bd:#f0d9b5; --card:#fff;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#1a1a19; --fg:#e6e4df; --muted:#9a978f; --rule:#38352f;
    --link:#e0a982; --draft-bg:#2c2416; --draft-fg:#e8c895; --draft-bd:#4a3c22; --card:#232220;
  }
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--fg);
  font-family:"Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif JP",serif;
  line-height:1.9; font-size:17px;
}
.wrap{max-width:42em; margin:0 auto; padding:3rem 1.3rem 6rem;}
h1{font-size:1.6rem; margin:0 0 .4rem;}
.lead{color:var(--muted); margin:0 0 2.4rem;}
.book{
  display:block; text-decoration:none; color:inherit;
  border:1px solid var(--rule); border-radius:10px; padding:1.2rem 1.3rem;
  margin:0 0 1.2rem; background:var(--card);
}
.book:hover{border-color:var(--link);}
.book .t{font-size:1.12rem; font-weight:700; margin-bottom:.3rem;}
.book .s{color:var(--muted); font-size:.95rem;}
.tag{
  display:inline-block; font-size:.78rem; background:var(--draft-bg); color:var(--draft-fg);
  border:1px solid var(--draft-bd); border-radius:5px; padding:.05rem .5rem; margin-left:.5rem; vertical-align:middle;
}
.note{color:var(--muted); font-size:.86rem; margin-top:3rem; border-top:1px solid var(--rule); padding-top:1rem;}
a{color:var(--link);}
</style>
</head>
<body>
<div class="wrap">
<h1>西川 純 ── 本</h1>

</a>

</p>
</div>
</body>
</html>
